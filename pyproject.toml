[project]
name = "adrs"
version = "1.14.1"
description = "Alpha development research system."
readme = "README.md"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = { file = "LICENSE" }
authors = [{ name = "Marcus Lee", email = "marcuslee@balaenaquant.com" }]
requires-python = ">=3.13"
dependencies = [
    "aion-scheduler==0.1.0",
    "bq-nats-client==0.1.6",
    "clickhouse-connect[async]==1.5.0",
    "colorlog==6.11.0",
    "cybotrade==2.4.0",
    "cybotrade-datasource==0.1.9",
    "grpcio==1.82.1",
    "httpx==0.28.1",
    "numpy==2.5.1",
    "pandas==3.0.3",
    "pandera==0.32.1",
    "polars==2.1.0",
    "pyarrow==25.0.0",
    "pydantic==2.13.4",
    "rich==15.0.0",
    "websockets==16.1.1",
    "yfinance==1.5.1",
]

[project.urls]
"Homepage" = "https://github.com/balaenaquant/adrs.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.custom]
path = "scripts/build.py"

[tool.pyrefly]
project-excludes = []

[tool.ruff]
lint.ignore = ["E731"]
extend-exclude = ["tests/lib/*"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(message)s"
pythonpath = ["."]
addopts = "--cov=adrs --cov-report=term-missing --cov-report=html --cov-fail-under=40"
markers = [
    "integration: requires local credentials or data files (deselect with -m 'not integration')",
]

[tool.coverage.run]
omit = ["adrs/wheels/*", "adrs/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "@abstractmethod"]

[dependency-groups]
dev = [
    "coverage==7.15.2",
    "fastparquet==2026.5.0",
    "hatch==1.17.1",
    "pre-commit==4.6.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
]
